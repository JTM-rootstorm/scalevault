services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: kivra_memory
      POSTGRES_USER: kivra_memory
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivra_memory -d kivra_memory"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - scalevault-postgres:/var/lib/postgresql/data

volumes:
  scalevault-postgres:
