[Unit]
# The canonical database lives on the dedicated persistent mount. Do not let
# PostgreSQL fall back to a directory on the LXC root filesystem.
RequiresMountsFor=/mnt/memory
ConditionPathIsMountPoint=/mnt/memory

[Service]
# The NFS export root-squashes uid 0. Run pg_ctlcluster as the cluster owner so
# its data-directory accessibility check and normal start/stop/reload paths can
# traverse the canonical PostgreSQL directory.
User=postgres
Group=postgres
