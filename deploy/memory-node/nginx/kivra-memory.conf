limit_req_zone $binary_remote_addr zone=kivra_memory_clients:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name memory-node.internal.example;

    ssl_certificate /etc/kivra-memory/tls/server.crt;
    ssl_certificate_key /etc/kivra-memory/tls/server.key;
    client_max_body_size 64k;

    location = /mcp {
        limit_req zone=kivra_memory_clients burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/(healthz|readyz|metrics)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
}
