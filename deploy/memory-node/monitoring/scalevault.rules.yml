groups:
  - name: scalevault-security-backup-operations
    rules:
      - alert: ScaleVaultMemoryNodeScrapeUnavailable
        expr: absent(up{job="scalevault-memory-node"}) or up{job="scalevault-memory-node"} == 0
        for: 2m
        labels: {severity: critical, category: monitoring}
        annotations: {summary: "ScaleVault Memory Node metrics are unavailable", response: "monitoring_unavailable"}
      - alert: ScaleVaultDatabaseMetricsUnavailable
        expr: absent(up{job="scalevault-database-metrics"}) or up{job="scalevault-database-metrics"} == 0 or kivra_memory_database_collector_up == 0
        for: 2m
        labels: {severity: critical, category: monitoring}
        annotations: {summary: "ScaleVault database aggregate metrics are unavailable", response: "database_metrics_unavailable"}
      - alert: ScaleVaultOperationalTelemetryMissing
        expr: up{job="scalevault-memory-node"} == 1 and on() (absent(kivra_memory_backup_age_seconds{kind="base"}) or absent(kivra_memory_wal_oldest_age_seconds) or absent(kivra_memory_storage_free_ratio))
        for: 5m
        labels: {severity: critical, category: monitoring}
        annotations: {summary: "Required ScaleVault operational telemetry is absent", response: "telemetry_missing"}
      - alert: ScaleVaultBackupFailure
        expr: increase(kivra_memory_backup_results_total{result="failure"}[15m]) > 0
        labels: {severity: critical, category: backup}
        annotations: {summary: "ScaleVault backup failed", response: "backup_failure"}
      - alert: ScaleVaultBackupVerificationFailure
        expr: increase(kivra_memory_backup_verification_results_total{result="failure"}[15m]) > 0
        labels: {severity: critical, category: backup}
        annotations: {summary: "ScaleVault backup verification failed", response: "backup_verification"}
      - alert: ScaleVaultBackupRPOCritical
        expr: kivra_memory_backup_age_seconds{kind="base"} > 93600
        labels: {severity: critical, category: backup}
        annotations: {summary: "ScaleVault has no verified daily base backup within 26 hours", response: "backup_stale"}
      - alert: ScaleVaultWALArchiveFailure
        expr: increase(kivra_memory_wal_archive_failures_total[10m]) > 0
        labels: {severity: critical, category: wal}
        annotations: {summary: "ScaleVault WAL archival failed", response: "wal_failure"}
      - alert: ScaleVaultWALAgeWarning
        expr: kivra_memory_wal_oldest_age_seconds > 600
        labels: {severity: warning, category: wal}
        annotations: {summary: "ScaleVault has WAL unarchived for over 10 minutes", response: "wal_backlog"}
      - alert: ScaleVaultWALAgeCritical
        expr: kivra_memory_wal_oldest_age_seconds > 900
        labels: {severity: critical, category: wal}
        annotations: {summary: "ScaleVault has WAL unarchived for over 15 minutes", response: "wal_backlog"}
      - alert: ScaleVaultStorageFreeWarning
        expr: kivra_memory_storage_free_ratio < 0.20
        labels: {severity: warning, category: storage}
        annotations: {summary: "ScaleVault storage is below 20 percent free", response: "storage_pressure"}
      - alert: ScaleVaultStorageFreeCritical
        expr: kivra_memory_storage_free_ratio < 0.10
        labels: {severity: critical, category: storage}
        annotations: {summary: "ScaleVault storage is below 10 percent free", response: "storage_pressure"}
      - alert: ScaleVaultOffsiteHeadUnverified
        expr: kivra_memory_offsite_unverified_head_age_seconds > 3600
        labels: {severity: warning, category: offsite}
        annotations: {summary: "A changed accepted archive head lacks a verified encrypted secondary copy", response: "offsite_stale"}
      - alert: ScaleVaultOffsiteVerificationFailure
        expr: increase(kivra_memory_offsite_verification_results_total{result="failure"}[15m]) > 0
        labels: {severity: critical, category: offsite}
        annotations: {summary: "ScaleVault offsite verification failed", response: "offsite_verification"}
      - alert: ScaleVaultArchiveLagWarning
        expr: kivra_memory_archive_lag_seconds{stage=~"export|push"} > 900
        labels: {severity: warning, category: archive}
        annotations: {summary: "ScaleVault archive work is over 15 minutes old", response: "archive_lag"}
      - alert: ScaleVaultArchiveLagCritical
        expr: kivra_memory_archive_lag_seconds{stage=~"export|push"} > 3600
        labels: {severity: critical, category: archive}
        annotations: {summary: "ScaleVault archive work is over one hour old", response: "archive_lag"}
      - alert: ScaleVaultArchiveVerificationFailure
        expr: increase(kivra_memory_archive_verification_failures_total{reason=~"continuity|divergence|manifest|signature"}[15m]) > 0
        labels: {severity: critical, category: archive}
        annotations: {summary: "ScaleVault archive continuity, divergence, manifest, or signature verification failed", response: "archive_verification"}
      - alert: ScaleVaultRunnableJobAgeWarning
        expr: kivra_memory_queue_oldest_age_seconds > 900
        labels: {severity: warning, category: queue}
        annotations: {summary: "ScaleVault runnable work is over 15 minutes old", response: "queue_stall"}
      - alert: ScaleVaultRunnableJobAgeCritical
        expr: kivra_memory_queue_oldest_age_seconds > 3600
        labels: {severity: critical, category: queue}
        annotations: {summary: "ScaleVault runnable work is over one hour old", response: "queue_stall"}
      - alert: ScaleVaultHardForgetTerminalJob
        expr: kivra_memory_hard_forget_purge_depth{state="dead"} > 0
        labels: {severity: critical, category: erasure}
        annotations: {summary: "ScaleVault has terminal hard-forget work", response: "purge_failure"}
      - alert: ScaleVaultHardForgetPurgeFailure
        expr: increase(kivra_memory_hard_forget_purge_results_total{result="failure"}[15m]) > 0
        labels: {severity: critical, category: erasure}
        annotations: {summary: "ScaleVault hard-forget purge failed", response: "purge_failure"}
      - alert: ScaleVaultPostgreSQLUnavailable
        expr: absent(up{job="scalevault-postgresql"}) or up{job="scalevault-postgresql"} == 0
        for: 2m
        labels: {severity: critical, category: database}
        annotations: {summary: "ScaleVault PostgreSQL is unavailable", response: "database_unavailable"}
      - alert: ScaleVaultDatabasePoolSaturationWarning
        expr: kivra_memory_database_pool_saturation_ratio > 0.80
        for: 5m
        labels: {severity: warning, category: database}
        annotations: {summary: "ScaleVault database pool is over 80 percent saturated", response: "pool_saturation"}
      - alert: ScaleVaultDatabasePoolSaturationCritical
        expr: kivra_memory_database_pool_saturation_ratio > 0.90
        for: 5m
        labels: {severity: critical, category: database}
        annotations: {summary: "ScaleVault database pool is over 90 percent saturated", response: "pool_saturation"}
      - alert: ScaleVaultTunnelTelemetryMissing
        expr: absent(kivra_memory_tunnel_connected)
        for: 5m
        labels: {severity: warning, category: tunnel}
        annotations: {summary: "Required ScaleVault tunnel telemetry is absent", response: "tunnel_disconnected"}
      - alert: ScaleVaultTunnelDisconnectedWarning
        expr: kivra_memory_tunnel_connected == 0
        for: 5m
        labels: {severity: warning, category: tunnel}
        annotations: {summary: "ScaleVault private tunnel has been disconnected for five minutes", response: "tunnel_disconnected"}
      - alert: ScaleVaultTunnelDisconnectedCritical
        expr: kivra_memory_tunnel_connected == 0
        for: 15m
        labels: {severity: critical, category: tunnel}
        annotations: {summary: "ScaleVault private tunnel has been disconnected for 15 minutes", response: "tunnel_disconnected"}
      - alert: ScaleVaultAuthorizationFailureSpike
        expr: sum(rate(kivra_memory_authentication_failures_total[5m])) > 1
        for: 5m
        labels: {severity: warning, category: authorization}
        annotations: {summary: "ScaleVault authorization failures exceed the activated baseline", response: "authorization_spike"}
      - alert: ScaleVaultDirectCredentialExpiryWarning
        expr: sum(kivra_memory_credentials_total{profile="direct_private",expiry=~"expired|le_1d|le_7d|le_30d",state="active"}) > 0
        labels: {severity: warning, category: credential}
        annotations: {summary: "A direct-private credential expires within 30 days", response: "credential_expiry"}
      - alert: ScaleVaultDirectCredentialExpiryCritical
        expr: sum(kivra_memory_credentials_total{profile="direct_private",expiry=~"expired|le_1d|le_7d",state="active"}) > 0
        labels: {severity: critical, category: credential}
        annotations: {summary: "A direct-private credential expires within seven days", response: "credential_expiry"}
      - alert: ScaleVaultGitHubTelemetryMissing
        expr: (kivra_memory_github_poll_interval_seconds > 0 unless on() kivra_memory_github_poll_age_seconds) or (kivra_memory_github_poll_age_seconds >= 0 unless on() kivra_memory_github_poll_interval_seconds)
        for: 2m
        labels: {severity: warning, category: github}
        annotations: {summary: "Enabled ScaleVault GitHub ingress telemetry is incomplete", response: "github_poll_stall"}
      - alert: ScaleVaultGitHubPollStalledWarning
        expr: kivra_memory_github_poll_age_seconds > 2 * scalar(kivra_memory_github_poll_interval_seconds)
        labels: {severity: warning, category: github}
        annotations: {summary: "ScaleVault GitHub poll age exceeds twice its configured interval", response: "github_poll_stall"}
      - alert: ScaleVaultGitHubPollStalledCritical
        expr: kivra_memory_github_poll_age_seconds > 4 * scalar(kivra_memory_github_poll_interval_seconds)
        labels: {severity: critical, category: github}
        annotations: {summary: "ScaleVault GitHub poll age exceeds four times its configured interval", response: "github_poll_stall"}
      - alert: ScaleVaultGitHubAuthFailure
        expr: increase(kivra_memory_github_events_total{category="auth_failure"}[15m]) > 0
        labels: {severity: critical, category: github}
        annotations: {summary: "ScaleVault GitHub authentication failed", response: "github_auth_failure"}
      - alert: ScaleVaultGitHubQuarantineSpike
        expr: increase(kivra_memory_github_events_total{category="quarantined"}[15m]) > 10
        labels: {severity: warning, category: github}
        annotations: {summary: "ScaleVault GitHub quarantine volume exceeds the activated baseline", response: "github_quarantine"}
      - alert: ScaleVaultProjectionInconsistency
        expr: sum(kivra_memory_projection_inconsistencies) > 0
        labels: {severity: critical, category: consistency}
        annotations: {summary: "ScaleVault projection and event state disagree", response: "projection_inconsistent"}
      - alert: ScaleVaultPublicExposure
        expr: sum(kivra_memory_public_exposure_probe_success) > 0 or increase(kivra_memory_public_exposure_backend_connections_total{result="unauthorized"}[15m]) > 0
        labels: {severity: critical, category: exposure}
        annotations: {summary: "An external probe reached a protected ScaleVault surface", response: "public_exposure"}
      - alert: ScaleVaultPITRDrillOverdue
        expr: kivra_memory_recovery_drill_age_seconds{kind="pitr"} > 3024000
        labels: {severity: warning, category: recovery}
        annotations: {summary: "ScaleVault PITR drill is over 35 days old", response: "recovery_drill"}
      - alert: ScaleVaultFullRecoveryDrillOverdue
        expr: kivra_memory_recovery_drill_age_seconds{kind="full"} > 8640000
        labels: {severity: warning, category: recovery}
        annotations: {summary: "ScaleVault full recovery drill is over 100 days old", response: "recovery_drill"}
