[Service]
SupplementaryGroups=kivra-sealed kivra-destruction-ledger
LoadCredential=sealed-digest-binding:/etc/kivra-memory/sealed-digest-binding
Environment=KIVRA_MEMORY_SEALED_CONTENT_ENABLED=true
Environment=KIVRA_MEMORY_SEALED_KEY_PROVIDER_ROOT=/var/lib/kivra-memory-sealed/keys
Environment=KIVRA_MEMORY_SEALED_DESTRUCTION_LEDGER_ROOT=/var/lib/kivra-memory-sealed/destruction-ledger
Environment=KIVRA_MEMORY_SEALED_DIGEST_BINDING_CREDENTIAL=/run/credentials/kivra-memory-api.service/sealed-digest-binding
ReadWritePaths=/var/lib/kivra-memory-sealed/keys/control
ReadWritePaths=/var/lib/kivra-memory-sealed/keys/material
ReadWritePaths=/var/lib/kivra-memory-sealed/destruction-ledger
