[Unit]
Requires=kivra-memory-sealed-restore-reconcile.service
After=kivra-memory-sealed-restore-reconcile.service

[Service]
SupplementaryGroups=kivra-sealed kivra-destruction-ledger
LoadCredential=sealed-digest-binding:/etc/kivra-memory/sealed-digest-binding
LoadCredential=destruction-ledger-anchor:/etc/kivra-memory/destruction-ledger-anchor
Environment=KIVRA_MEMORY_SEALED_CONTENT_ENABLED=true
Environment=KIVRA_MEMORY_SEALED_KEY_PROVIDER_ROOT=/var/lib/kivra-memory-sealed/keys
Environment=KIVRA_MEMORY_SEALED_DESTRUCTION_LEDGER_ROOT=/var/lib/kivra-memory-sealed/destruction-ledger
Environment=KIVRA_MEMORY_SEALED_DESTRUCTION_LEDGER_ANCHOR_PATH=/var/lib/kivra-memory-destruction-anchor/current.json
Environment=KIVRA_MEMORY_SEALED_DESTRUCTION_LEDGER_ANCHOR_CREDENTIAL=/run/credentials/kivra-memory-codex-ingress.service/destruction-ledger-anchor
Environment=KIVRA_MEMORY_SEALED_DIGEST_BINDING_CREDENTIAL=/run/credentials/kivra-memory-codex-ingress.service/sealed-digest-binding
ReadWritePaths=/var/lib/kivra-memory-sealed/keys/control
ReadWritePaths=/var/lib/kivra-memory-sealed/keys/material
ReadOnlyPaths=/var/lib/kivra-memory-sealed/destruction-ledger
ReadOnlyPaths=/var/lib/kivra-memory-destruction-anchor
