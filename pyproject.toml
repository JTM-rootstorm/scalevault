[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "scalevault"
version = "0.1.0"
description = "Private, auditable shared persona continuity service"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "alembic>=1.16,<2",
    "cbor2>=5.7,<6",
    "cryptography>=46,<51",
    "fastapi>=0.116,<1",
    "jsonschema>=4.25,<5",
    "mcp>=1.12,<2",
    "pgvector>=0.4,<1",
    "prometheus-client>=0.22,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "rfc8785>=0.1,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.35,<1",
    "zstandard>=0.24,<1",
]

[project.optional-dependencies]
embedding-worker = [
    "numpy>=2.2,<3",
    "onnxruntime>=1.22,<2",
    "tokenizers>=0.21,<1",
]

[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "httpx>=0.28,<1",
    "hypothesis>=6.136,<7",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
kivra-memory-api = "kivra_memory.api.app:main"
kivra-memory-archive-exporter = "kivra_memory.workers.archive_main:main"
kivra-memory-github-ingress = "kivra_memory.workers.github_ingress_main:main"
kivra-memory-worker = "kivra_memory.workers.main:main"
kivra-memory-lifecycle-worker = "kivra_memory.workers.lifecycle_main:main"
kivra-memory-sealed-worker = "kivra_memory.workers.sealed_main:main"

[tool.hatch.build.targets.wheel]
packages = ["services/memory-node/src/kivra_memory"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "database: provisions or controls a disposable PostgreSQL test environment",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "services/memory-node/src"

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true
