[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scalevault"
version = "0.1.0"
description = "Private, auditable shared persona continuity service"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "mcp>=1.12,<2",
    "prometheus-client>=0.22,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "hypothesis>=6.136,<7",
    "jsonschema>=4.25,<5",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
kivra-memory-api = "kivra_memory.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["services/memory-node/src/kivra_memory"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "services/memory-node/src"

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true
